spring.application.name=demo

# Datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/medspa?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ensure schema.sql is applied on startup for the existing local database
spring.sql.init.mode=always

# MyBatis settings
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=com.example.demo.domain
mybatis.configuration.map-underscore-to-camel-case=true

# Jackson
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# JWT
security.jwt.secret=${JWT_SECRET:change-this-to-a-very-long-random-secret-key-123456-DEV-ONLY}
# 过期秒数（2小时）
security.jwt.expire-seconds=${JWT_EXPIRE_SECONDS:7200}
# Cookie secure 标志（开发环境 false，生产环境 true）
security.jwt.secure=${JWT_COOKIE_SECURE:false}